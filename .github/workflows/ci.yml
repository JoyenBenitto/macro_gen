name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # macro_gen links against libngspice at build time (see build.rs),
      # so the shared library and headers must be present before cargo runs.
      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice libngspice0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  changelog-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure CHANGELOG.md was updated
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx CHANGELOG.md; then
            echo "CHANGELOG.md was updated."
          else
            echo "::error::CHANGELOG.md was not updated in this PR. Add an entry describing the change."
            exit 1
          fi

  publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      already_published: ${{ steps.check.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice libngspice0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # Publishing the same version twice is a hard error, and the version
      # doesn't necessarily bump on every merge to main, so skip quietly
      # instead of failing the workflow when it's already out there.
      - name: Check whether this version is already published
        id: check
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          response=$(curl -s -H "User-Agent: macro_gen-ci (https://github.com/JoyenBenitto/macro_gen)" \
            https://crates.io/api/v1/crates/macro_gen)
          published=$(echo "$response" | jq -r --arg v "$version" '([.versions[]?.num] // []) | any(. == $v)' 2>/dev/null || echo false)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "version=$version published=$published"

      - name: Publish to crates.io
        if: steps.check.outputs.published == 'false'
        run: cargo publish --token ${{ secrets.CRATE_IO_SECRET }}

  release:
    needs: publish
    if: needs.publish.outputs.already_published == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pulls the section for this version out of CHANGELOG.md (between its
      # "## [x.y.z]" heading and the next one) to use as the release body.
      - name: Extract changelog section
        run: |
          awk -v ver="${{ needs.publish.outputs.version }}" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            /^## \[/ && flag { flag=0 }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          cat release_notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.publish.outputs.version }}
          name: v${{ needs.publish.outputs.version }}
          body_path: release_notes.md
