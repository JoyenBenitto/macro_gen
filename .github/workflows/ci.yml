name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # macro_gen links against libngspice at build time (see build.rs),
      # so the shared library and headers must be present before cargo runs.
      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice libngspice0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice libngspice0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # Publishing the same version twice is a hard error, and the version
      # doesn't necessarily bump on every merge to main, so skip quietly
      # instead of failing the workflow when it's already out there.
      - name: Check whether this version is already published
        id: check
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          published=$(curl -s https://crates.io/api/v1/crates/macro_gen \
            | jq -r --arg v "$version" '([.versions[]?.num] // []) | any(. == $v)')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - name: Publish to crates.io
        if: steps.check.outputs.published == 'false'
        run: cargo publish --token ${{ secrets.CRATE_IO_SECRET }}
